# PortfolioSight on KS-001 (spec 9.1). The host is shared: one loopback port, one named volume,
# hard CPU and memory limits, and no data bind mount. A build uses as many worker processes as
# its CPU limit allows (at most 8; PS_BUILD_WORKERS, unset here, overrides it). GIT_SHA comes
# from deploy/.env, written by scripts/deploy_ks001.sh, so `build`, `up` and the nightly
# timer's `run` resolve the same image.
#
#   docker compose -f deploy/docker-compose.yml up -d api
#   docker compose -f deploy/docker-compose.yml run --rm --no-deps nightly

name: portfoliosight

services:
  api:
    image: portfoliosight:${GIT_SHA}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: portfoliosight-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file: ~/.secrets/portfoliosight.env
    environment:
      PS_STORE: r2
      PS_R2_BUCKET: portfoliosight-data
      PS_CACHE_DIR: /app/cache
      PS_CACHE_MAX_MB: "300"
    volumes:
      - ps-cache:/app/cache
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-m", "portfoliosight.api.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nightly:
    image: portfoliosight:${GIT_SHA}
    profiles: ["jobs"]
    command: python -m portfoliosight.jobs.nightly
    env_file: ~/.secrets/portfoliosight.env
    environment:
      PS_STORE: r2
      PS_R2_BUCKET: portfoliosight-data
      PS_CACHE_DIR: /app/cache
      PS_CACHE_MAX_MB: "300"
    volumes:
      - ps-cache:/app/cache
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ps-cache:
